name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Hermetic CI: the corpus and model refs are pinned, never
  # floating. Bump these lines deliberately with each release (the
  # tag carries what changed).
  # CORPUS_REF pins the suite 0.11.0 CONTENT commit (the parity
  # families: resolver, citation, CLI + the engine-scaled linter).
  # The published v0.11.0 tag on asciichem-tests currently points at
  # the suite-0.9.0-era tree (a mis-pointed tag, awaiting a maintainer
  # re-point) — hence the SHA, checked out after a full clone.
  CORPUS_REF: 8c8bca422017e689a0e1f1fa21d4c8dec37070f7
  MODEL_REF: v0.6.0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - name: Clone conformance corpus (asciichem-tests) and pin $CORPUS_REF
        run: |
          git clone https://github.com/asciichem/asciichem-tests.git ../asciichem-tests
          git -C ../asciichem-tests checkout --quiet "$CORPUS_REF"
      - name: Clone model schemas (asciichem-model)
        run: git clone --depth 1 --branch "$MODEL_REF" https://github.com/asciichem/asciichem-model.git ../asciichem-model
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify vendored PARG artifact is current
        run: |
          git clone --depth 1 https://github.com/asciichem/asciichem-rs.git /tmp/asciichem-rs
          diff src/parg/asciichem.json /tmp/asciichem-rs/artifacts/asciichem.json \
            || (echo "src/parg/asciichem.json drifted from the asciichem-parg contract (artifacts/asciichem.json) — re-vendor"; exit 1)
      - run: npm test
